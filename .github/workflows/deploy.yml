name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queued runs supersede each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TEST PHASE ONLY: the site is served from 1nto5.github.io/dps-www, so
      # build with that base and prefix hand-written absolute URLs. At the
      # DNS cutover to dpsszczytno.pl: delete the env block and the sed step,
      # and add a CNAME file.
      - name: Build site
        run: bun run build
        env:
          SITE: https://1nto5.github.io
          BASE: /dps-www

      - name: Prefix hand-written absolute URLs with the base path
        run: |
          find dist -name '*.html' -exec sed -i -E \
            's#(href|src)="/#\1="/dps-www/#g; s#="/dps-www/dps-www/#="/dps-www/#g' {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
